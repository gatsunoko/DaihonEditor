<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>台本制作エディタ</title>
    <link rel="stylesheet" href="styles.css?v=20260623-left-drawer-fit1">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="project-block">
          <input id="projectTitle" class="project-title" type="text" aria-label="プロジェクト名">
          <div class="save-state" id="saveState">LocalStorageに自動保存済み</div>
        </div>
        <div class="toolbar" aria-label="ファイル操作">
          <div class="view-toggles" aria-label="サイドバー表示">
            <button id="toggleSpeakerPaneButton" class="sidebar-icon-button hamburger-toggle" type="button" aria-label="話者サイドバーを切り替え" aria-pressed="true">
              <span class="hamburger-icon" aria-hidden="true"><span></span><span></span><span></span></span>
            </button>
            <button id="toggleSettingsPaneButton" class="sidebar-icon-button panel-toggle" type="button" aria-label="設定サイドバーを切り替え" aria-pressed="true">
              <span class="panel-icon" aria-hidden="true"><span></span></span>
            </button>
          </div>
          <button id="newProjectButton" type="button">新規</button>
          <button id="saveJsonButton" type="button">JSON保存</button>
          <label class="file-button">
            JSON読込
            <input id="loadJsonInput" type="file" accept="application/json,.json">
          </label>
          <button id="exportTxtButton" type="button">TXT書出し</button>
          <button id="exportDocxButton" type="button">DOCX書出し</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="speaker-pane side-pane" aria-label="話者登録">
          <section class="panel">
            <h2>話者登録</h2>
            <form id="speakerForm" class="speaker-form">
              <input id="speakerNameInput" type="text" placeholder="話者名">
              <input id="speakerColorInput" type="color" value="#4f8cff" aria-label="話者背景色" title="話者背景色">
              <input id="speakerBodyColorInput" type="color" value="#1f2937" aria-label="本文色" title="本文色">
              <button type="submit">登録</button>
            </form>
            <div id="speakerList" class="speaker-list"></div>
          </section>
        </aside>

        <section class="editor-pane" aria-label="台本エディタ">
          <div class="section-tabs">
            <div id="sectionTabs" class="tabs" role="tablist"></div>
            <button id="addSectionButton" class="icon-button" type="button" title="章を追加" aria-label="章を追加">+</button>
          </div>

          <div class="editor-head">
            <div>行</div>
            <div>話者 / 種別</div>
            <div>本文</div>
            <div></div>
          </div>
          <div id="scriptRows" class="script-rows" aria-live="polite"></div>
          <div class="editor-footer">
            <div class="format-toolbar" aria-label="本文装飾">
              <button id="bodyBoldButton" type="button" title="選択した本文を太字" onmousedown="if (window.scriptEditorApplyBodyBold) { window.scriptEditorApplyBodyBold(event); } else { event.preventDefault(); document.execCommand('bold', false, null); }">B</button>
              <button id="bodyColorApplyButton" type="button" title="選択した本文に前回の色を適用">色</button>
              <label class="format-color-picker" title="適用する色を変更">
                <input id="bodyColorInput" type="color" value="#dc2626" aria-label="選択した本文の色">
              </label>
              <button id="bodyColorClearButton" type="button">色を戻す</button>
              <span id="formatStatus" class="format-status" aria-live="polite"></span>
            </div>
            <button id="addLineButton" type="button">行を追加</button>
            <button id="copyLinesButton" type="button">選択行をコピー</button>
            <button id="cutLinesButton" type="button">選択行をカット</button>
            <button id="pasteLinesButton" type="button">貼り付け</button>
          </div>
        </section>

        <aside class="settings-pane side-pane" aria-label="設定">
          <section class="panel">
            <h2>検索・置換</h2>
            <div class="field-stack">
              <label>
                検索
                <input id="searchInput" type="search" placeholder="検索語">
              </label>
              <label>
                置換
                <input id="replaceInput" type="text" placeholder="置換後の文字">
              </label>
            </div>
            <div class="scope-tabs" role="radiogroup" aria-label="置換範囲">
              <button class="scope-button active" type="button" data-scope="all">全文</button>
              <button class="scope-button" type="button" data-scope="speaker">話者名</button>
              <button class="scope-button" type="button" data-scope="body">本文</button>
            </div>
            <div class="search-actions">
              <button id="prevMatchButton" type="button">前へ</button>
              <button id="nextMatchButton" type="button">次へ</button>
              <button id="replaceOneButton" type="button">1件置換</button>
              <button id="replaceAllButton" type="button">全置換</button>
            </div>
            <div id="matchStatus" class="status-line">0件</div>
          </section>

          <section class="panel compact">
            <h2>文字数</h2>
            <div class="count-grid">
              <div>
                <span>全文本文</span>
                <strong id="totalBodyChars">0</strong>
              </div>
              <div>
                <span>表示中本文</span>
                <strong id="sectionBodyChars">0</strong>
              </div>
            </div>
          </section>

          <section class="panel compact">
            <h2>書出し設定</h2>
            <label class="option-row">
              <input id="exportBlankLineInput" type="checkbox">
              <span>台詞行の間に空行を入れる</span>
            </label>
          </section>

          <section class="panel compact">
            <h2>Google Docs貼付け</h2>
            <div class="paste-copy-actions">
              <button id="copyGoogleDocsButton" type="button">リッチコピー</button>
            </div>
            <div id="googleDocsCopyStatus" class="status-line">下のプレビューを選択してコピーすることもできます。</div>
            <div
              id="googleDocsPreview"
              class="docs-paste-preview"
              contenteditable="true"
              aria-label="Google Docs貼り付け用プレビュー"
            ></div>
          </section>

        </aside>
      </main>
    </div>

    <script src="app.js?v=20260623-left-drawer-fit1"></script>
  </body>
</html>
