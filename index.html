<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>台本制作エディタ</title>
    <link rel="stylesheet" href="styles.css?v=20261023-speaker-count-single-line">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="project-block">
          <input id="projectTitle" class="project-title" type="text" placeholder="台本タイトル" aria-label="台本タイトル">
          <input id="sectionSearch" class="section-search" type="search" placeholder="セクション検索" aria-label="セクション検索" aria-controls="sectionTabs" autocomplete="off">
        </div>
        <div class="toolbar" aria-label="ファイル操作">
          <div class="view-toggles" aria-label="サイドバー表示">
            <button id="toggleSpeakerPaneButton" class="sidebar-icon-button hamburger-toggle" type="button" aria-label="話者サイドバーを切り替え" aria-pressed="true">
              <span class="hamburger-icon" aria-hidden="true"><span></span><span></span><span></span></span>
            </button>
            <button id="toggleSettingsPaneButton" class="sidebar-icon-button panel-toggle" type="button" aria-label="設定サイドバーを切り替え" aria-pressed="true">
              <span class="panel-icon" aria-hidden="true"><span></span></span>
            </button>
          </div>
          <button id="newProjectButton" type="button">新規</button>
          <button id="saveJsonButton" type="button" title="現在のJSONへ保存。未設定の場合は新規ファイルを作成">JSON保存</button>
          <button id="saveJsonAsButton" type="button" title="既存ファイルを上書きせず、新しいJSONとして保存">別名保存</button>
          <button id="backupSettingsButton" type="button" title="10分ごとの世代バックアップ先を設定">バックアップ設定</button>
          <button id="loadJsonButton" type="button">JSON読込</button>
          <input id="loadJsonInput" type="file" accept="application/json,.json" hidden>
          <button id="exportTxtButton" type="button">TXT書出し</button>
          <button id="exportDocxButton" type="button">DOCX書出し</button>
          <button id="connectAiButton" type="button" aria-haspopup="dialog" aria-controls="aiConnectionDialog" aria-expanded="false">AI接続</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="speaker-pane side-pane" aria-label="話者登録">
          <section class="panel">
            <h2>話者登録</h2>
            <form id="speakerForm" class="speaker-form">
              <input id="speakerNameInput" type="text" placeholder="話者名">
              <input id="speakerColorInput" type="color" value="#4f8cff" aria-label="話者背景色" title="話者背景色">
              <input id="speakerBodyColorInput" type="color" value="#1f2937" aria-label="本文色" title="本文色">
              <button type="submit">登録</button>
            </form>
            <label class="speaker-filter">
              <span>表示する話者</span>
              <select id="speakerFilterSelect">
                <option value="">すべての話者</option>
              </select>
            </label>
            <div id="speakerList" class="speaker-list"></div>
          </section>
        </aside>

        <section class="editor-pane" aria-label="台本エディタ">
          <div class="section-tabs">
            <div id="sectionTabs" class="tabs" role="tablist"></div>
            <button id="addSectionButton" class="icon-button" type="button" title="章を追加" aria-label="章を追加">+</button>
          </div>

          <div class="editor-head">
            <div>行</div>
            <div>備考</div>
            <div>話者 / 種別</div>
            <div>本文</div>
            <div></div>
          </div>
          <div id="scriptRows" class="script-rows" aria-live="polite"></div>
          <div class="editor-footer">
            <div class="format-toolbar" aria-label="本文装飾">
              <button id="bodyBoldButton" type="button" title="選択した本文を太字" onmousedown="if (window.scriptEditorApplyBodyBold) { window.scriptEditorApplyBodyBold(event); } else { event.preventDefault(); document.execCommand('bold', false, null); }">B</button>
              <button id="bodyColorApplyButton" type="button" title="選択した本文に前回の色を適用">色</button>
              <label class="format-color-picker" title="適用する色を変更">
                <input id="bodyColorInput" type="color" value="#dc2626" aria-label="選択した本文の色">
              </label>
              <button id="bodyColorClearButton" type="button">色を戻す</button>
              <span id="formatStatus" class="format-status" aria-live="polite"></span>
            </div>
            <button id="addLineButton" type="button">行を追加</button>
            <button id="undoDeleteLineButton" type="button" disabled>Undo</button>
            <span id="selectedLineStatus" class="selected-line-status" aria-live="polite"></span>
            <button id="clearSelectedLinesButton" class="selected-lines-clear" type="button" hidden>選択を解除</button>
            <button id="copyLinesButton" type="button">選択行をコピー</button>
            <button id="cutLinesButton" type="button">選択行をカット</button>
            <button id="pasteLinesButton" type="button">貼り付け</button>
          </div>
        </section>

        <aside class="settings-pane side-pane" aria-label="設定">
          <section class="panel furigana-panel">
            <h2>ふりがな</h2>
            <label class="option-row furigana-visibility-option">
              <input id="furiganaVisibleInput" type="checkbox" checked>
              <span>本文・書出し・コピーに表示</span>
            </label>
            <form id="furiganaForm" class="furigana-form">
              <input id="furiganaWordInput" type="text" placeholder="単語（例：織田信長）" aria-label="ふりがなを付ける単語">
              <input id="furiganaReadingInput" type="text" placeholder="ふりがな（例：おだ のぶなが）" aria-label="ふりがな">
              <button type="submit">登録</button>
            </form>
            <div id="furiganaList" class="furigana-list"></div>
            <div id="furiganaStatus" class="status-line" aria-live="polite"></div>
          </section>

          <section class="panel">
            <h2>検索・置換</h2>
            <div class="field-stack">
              <label>
                検索
                <input id="searchInput" type="search" placeholder="検索語">
              </label>
              <label>
                置換
                <input id="replaceInput" type="text" placeholder="置換後の文字">
              </label>
            </div>
            <div class="scope-tabs" role="radiogroup" aria-label="置換範囲">
              <button class="scope-button active" type="button" data-scope="all">全文</button>
              <button class="scope-button" type="button" data-scope="speaker">話者名</button>
              <button class="scope-button" type="button" data-scope="body">本文</button>
            </div>
            <label class="option-row search-section-only">
              <input id="replaceCurrentSectionOnlyInput" type="checkbox">
              <span>現在のセクションのみ</span>
            </label>
            <div class="search-actions">
              <button id="prevMatchButton" type="button">前へ</button>
              <button id="nextMatchButton" type="button">次へ</button>
              <button id="replaceOneButton" type="button">1件置換</button>
              <button id="replaceAllButton" type="button">全置換</button>
            </div>
            <div id="matchStatus" class="status-line">0件</div>
          </section>

          <section class="panel compact">
            <h2>文字数</h2>
            <div class="count-grid">
              <div>
                <span>全文本文</span>
                <strong id="totalBodyChars">0</strong>
              </div>
              <div>
                <span>表示中本文</span>
                <strong id="sectionBodyChars">0</strong>
              </div>
            </div>
          </section>

          <section class="panel compact">
            <h2>書出し設定</h2>
            <label class="option-row">
              <input id="exportBlankLineInput" type="checkbox">
              <span>台詞行の間に空行を入れる</span>
            </label>
            <label class="option-row">
              <input id="exportNotesInput" type="checkbox">
              <span>備考も書き出す</span>
            </label>
            <label class="option-row">
              <input id="exportNoteSeparatorInput" type="checkbox">
              <span>備考に区切り線を入れる</span>
            </label>
          </section>

          <section class="panel compact">
            <h2>Google Docs貼付け</h2>
            <div class="paste-copy-actions">
              <button id="copyGoogleDocsButton" type="button">全文リッチコピー</button>
              <button id="copySpeakersOnlyGoogleDocsButton" type="button">話者のみコピー</button>
              <button id="copyCurrentSectionGoogleDocsButton" type="button">選択セクションコピー</button>
              <button id="copyFilteredGoogleDocsButton" type="button" disabled>表示話者コピー</button>
              <button id="copySelectedGoogleDocsButton" type="button" disabled>選択行コピー</button>
            </div>
            <div id="googleDocsCopyStatus" class="status-line">リッチコピーできます。</div>
          </section>

        </aside>
      </main>
    </div>

    <div class="status-notifications" aria-label="保存の通知">
      <div class="status-notice" id="saveState" role="status" hidden></div>
      <div class="status-notice" id="backupState" role="status" hidden></div>
    </div>

    <dialog id="aiConnectionDialog" class="ai-connection-dialog" aria-labelledby="aiConnectionTitle">
      <h2 id="aiConnectionTitle">AIから台本を編集</h2>
      <p>接続すると、CodexやGPT Workからこの画面の台本を読み取り・編集できます。AIの変更は保存され、Undoで取り消せます。</p>
      <p>最初の接続は最大20秒待って再試行します。接続後に通信が途切れても、自動で復帰します。台本のタブが休止した場合は、タブを表示すると復帰します。</p>
      <label for="aiServerUrl">接続先</label>
      <input id="aiServerUrl" type="url" value="http://127.0.0.1:39041" spellcheck="false" autocomplete="off">
      <p id="aiConnectionStatus" role="status" aria-live="polite">未接続</p>
      <div class="ai-connection-actions">
        <button id="aiConnectConfirm" type="button">接続</button>
        <button id="aiDisconnectButton" type="button" disabled>接続を解除</button>
        <button id="aiConnectionClose" type="button">閉じる</button>
      </div>
    </dialog>

    <script src="mcp/project-edits.js?v=20261104-furigana"></script>
    <script src="app.js?v=20261104-furigana"></script>
    <script src="mcp/browser-bridge.js?v=20261020-ai-idle-2"></script>
  </body>
</html>
